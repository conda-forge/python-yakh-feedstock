schema_version: 1

context:
  name: python-yakh
  version: "0.4.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/python_yakh-${{ version }}.tar.gz
  sha256: 7c4b73e8e8ba8f36ca53ed963a3a035f0e11bfa429b807c9aca58105cfd151c0

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - poetry-core
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - yakh
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Yet Another Keypress Handler
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/petereon/yakh

extra:
  recipe-maintainers:
    - thewchan
